name: Vietnamese Speech to Text

on:
  workflow_dispatch:
    inputs:
      audio_url:
        description: "Link file MP3, WAV, M4A"
        required: true
        type: string

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Download audio
        env:
          AUDIO_URL: ${{ inputs.audio_url }}
        run: |
          mkdir -p audio
          python - <<'PY'
          import os
          import urllib.request

          url = os.environ["AUDIO_URL"]

          if not url.startswith("https://"):
              raise ValueError("Only HTTPS URLs are supported")

          request = urllib.request.Request(
              url,
              headers={"User-Agent": "Mozilla/5.0"}
          )

          with urllib.request.urlopen(request, timeout=120) as response:
              content_type = response.headers.get("Content-Type", "")
              if "text/html" in content_type:
                  raise ValueError("URL points to an HTML page, not an audio file")

              with open("audio/input_audio", "wb") as f:
                  while True:
                      chunk = response.read(1024 * 1024)
                      if not chunk:
                          break
                      f.write(chunk)

          print("Audio downloaded successfully")
          PY

      - name: Transcribe Vietnamese
        run: |
          python scripts/transcribe_vi.py audio/input_audio

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: vietnamese-transcription
          path: output/
          if-no-files-found: error
