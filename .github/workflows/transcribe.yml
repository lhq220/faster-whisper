name: Vietnamese Speech to Text and Call Analysis
on:
  workflow_dispatch:
    inputs:
      audio_url:
        description: 'Direct HTTPS MP3/WAV/M4A URL'
        required: true
        type: string
jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Download audio
        env:
          AUDIO_URL: ${{ inputs.audio_url }}
        run: |
          python - <<'PY'
          import os, urllib.request, ipaddress, socket
          from urllib.parse import urlparse
          url=os.environ['AUDIO_URL']
          parsed=urlparse(url)
          if parsed.scheme!='https' or not parsed.hostname:
              raise ValueError('Use a direct HTTPS audio file URL')
          for addr in socket.getaddrinfo(parsed.hostname,443):
              ip=ipaddress.ip_address(addr[4][0])
              if not ip.is_global: raise ValueError('Private/non-public address not allowed')
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl):
                  raise ValueError('Redirects not supported; use final direct HTTPS URL')
          opener=urllib.request.build_opener(NoRedirect)
          req=urllib.request.Request(url,headers={'User-Agent':'CallTranscriber/1.0'})
          os.makedirs('audio',exist_ok=True)
          with opener.open(req,timeout=60) as response,open('audio/input_audio','wb') as out:
              if 'text/html' in response.headers.get('Content-Type',''):
                  raise ValueError('URL returned HTML, not audio')
              size=0
              while True:
                  chunk=response.read(1024*1024)
                  if not chunk: break
                  size+=len(chunk)
                  if size>200*1024*1024: raise ValueError('Audio over 200 MB')
                  out.write(chunk)
          print(f'Downloaded {size} bytes')
          PY
      - name: Transcribe Vietnamese
        run: python scripts/transcribe_vi.py audio/input_audio
      - name: Analyze call and render HTML
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python scripts/analyze_call.py output/input_audio.json
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: call-analysis-results
          path: output/
          if-no-files-found: warn
          retention-days: 7
